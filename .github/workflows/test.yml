name: tests

# Run on every push to main + every PR. Catches regressions BEFORE they
# can land in a deploy. The project has 70+ test files (Go + Python) but
# no CI before this — a regression slipping in between commit and deploy
# was a real exposure (especially given the audit pass on 2026-05-09 that
# found 5 fail-open bugs none of which had explicit regression tests at
# the time).
#
# Workflow strategy:
#   - Run Go test suite (./...) on every push
#   - Run Python test suite (scripts/test_*.py) on every push
#   - Both jobs in parallel (different runners) for speed
#   - go.mod-pinned Go version + project's tested Python version
#
# Lint: shellcheck + ruff added 2026-05-09 after the audit pass found 13
# fail-open bugs of the same shape across 3 sessions. Both tools catch the
# specific patterns most prevalent in those bugs (silent || true, unused
# imports, swallowed exit codes, unquoted vars). Multiplicative payoff:
# every future PR gets the check.
#
# Not in scope (explicitly):
#   - golangci-lint, mypy — project hasn't standardized on these.
#   - Coverage reporting — tests-pass-or-fail is the contract; coverage
#     gating would force decisions about thresholds.
#   - Build artifacts — operator deploys via deploy/redeploy.sh which
#     builds on the VPS itself. CI doesn't need to publish binaries.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-tests:
    name: Go test ./...
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Read the version directly from go.mod's `go ...` directive.
          # No pinned version to drift; bump go.mod and CI follows.
          go-version-file: 'go.mod'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run go test
        run: go test ./...

  python-tests:
    name: Python test_*.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.11+ for PEP 604 union types ('str | None') used by the
          # decision-grade scripts. Project tests against 3.14 locally.
          python-version: '3.11'

      - name: Run unittest test files
        run: |
          # Each test_*.py is a self-contained unittest.main() entry.
          # Loop instead of unittest discover so a single test-file
          # failure doesn't mask others.
          set -e
          for f in scripts/test_*.py; do
            echo "=== $f ==="
            python3 "$f"
          done

  lint:
    name: shellcheck + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          pip install --quiet ruff

      # Two passes per tool, by audience:
      #   - "Operational" scripts (forward_paper_status, post_deploy_check,
      #     weekly_audit, run_drift_check, paper_live_*, lib/, deploy/) are
      #     safety-critical. Strict at warning severity.
      #   - All other shell scripts in the repo (historical sweep + analysis
      #     artifacts) are frozen. Lint at error severity only — catches real
      #     bugs without forcing a refactor of locked research scripts.
      - name: shellcheck (operational, strict)
        run: |
          shellcheck -S warning \
            scripts/forward_paper_status.sh \
            scripts/post_deploy_check.sh \
            scripts/weekly_audit.sh \
            scripts/run_drift_check.sh \
            scripts/paper_live_*.sh \
            scripts/lib/*.sh \
            deploy/*.sh

      - name: shellcheck (whole repo, errors only)
        run: |
          # Globs may match no files in some checkouts; --shell=bash forces
          # parser mode so non-bash files don't silently pass.
          shellcheck -S error scripts/*.sh deploy/*.sh

      # Ruff: --select F is the pyflakes ruleset — catches the bug-class
      # equivalent of shellcheck warnings (unused imports/variables, undefined
      # names, real-bug patterns). Style rules (E*, W*) are NOT enforced —
      # the project hasn't standardized on a style and forcing one would be
      # a separate decision. Run on all of scripts/ so the safety-critical
      # scripts AND historical analysis scripts must stay clean of pyflakes
      # findings going forward.
      - name: ruff (pyflakes ruleset on scripts/)
        run: ruff check --select F scripts/
