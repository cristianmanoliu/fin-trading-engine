# systemd drop-in for Layer 3 shadow-parity wrap.
#
# Per-instance override at /etc/systemd/system/paper-live@<sym>.service.d/layer3.conf.
# Wraps the LIVE Stub primary in a TeeExecutor that also fans signals/ticks
# to a BinanceLive(testnet) shadow on the SAME tick stream. Per locked rule
# results/real_money_executor_architecture_decision_rule_2026-05-08.md,
# Layer 3 same-tick parity is the formally-required gate before STAGE_1.
#
# Activation:
#   sudo install -m 644 deploy/systemd/layer3.conf \
#     /etc/systemd/system/paper-live@kavausdt.service.d/layer3.conf
#   sudo install -m 644 deploy/systemd/layer3.conf \
#     /etc/systemd/system/paper-live@ensusdt.service.d/layer3.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart paper-live@kavausdt.service paper-live@ensusdt.service
#
# Reversal: rm the drop-in file + daemon-reload + restart.
# Engine journal-replay recovers any open position cleanly.
#
# Journal layout:
#   - Stub primary (unchanged): /var/log/paper-live/journal/<SYM>-YYYY-MM.jsonl
#   - Layer 3 shadow (new):    /var/log/paper-live/journal/layer3/<SYM>-YYYY-MM.jsonl
# All decision-grade gates (forward_paper_status, drift detector, daily_digest)
# continue to read from the live root path — they remain UNCHANGED by this wrap.
#
# Pre-reg: results/layer3_enablement_2026-05-19.md.

[Service]
# Layer 3 needs testnet credentials (separate from mainnet — generate at
# testnet.binancefuture.com). They live in /etc/paper-live/testnet-env
# alongside the existing /etc/paper-live/env. Last-loaded wins for
# duplicate keys; /etc/paper-live/env has no BINANCE_API_KEY, so no clash.
EnvironmentFile=/etc/paper-live/testnet-env

# Clear inherited ExecStart so the replacement below takes effect.
# systemd requires this empty assignment before redeclaring ExecStart
# in a drop-in.
ExecStart=
ExecStart=/opt/trading-engine/bin/engine --config /opt/trading-engine/configs/%i.yaml \
    --signal-tf 4H --target-rr 6.0 \
    --side-filter short \
    --funding-csv-dir /opt/trading-engine/data/funding \
    --fee-bps 10 --stop-slippage-bps 5 --funding-bps-per-day 0 \
    --max-hold-hours 504 \
    --shadow alt5-15-336:5-15-336,alt5-15-504:5-15-504,bb20:bb:20-2.0-504,alt5-21-504:5-21-504,alt7-14-504:7-14-504,alt10-30-504:10-30-504,alt12-26-504:12-26-504,alt21-50-504:21-50-504 \
    --layer3-binance-testnet-journal-dir /var/log/paper-live/journal/layer3
